<section class="management-container">
  <header class="header-card-container">
    <div><span class="category-tag">QUẢN LÝ ĐIỀU PHỐI</span><h1 class="main-title">Tài xế và Phụ xe</h1></div>
    <button type="button" class="btn-primary" (click)="openAddModal()">+ Thêm nhân sự</button>
  </header>
  <div class="dashboard-card">
    <nav class="pill-tabs">
      <button type="button" [class.active]="activeTab === 'Tất cả'" (click)="setTab('Tất cả')">Tất cả ({{getTotalCount()}})</button>
      <button type="button" [class.active]="activeTab === 'Tài xế'" (click)="setTab('Tài xế')">Tài xế ({{getDriverCount()}})</button>
      <button type="button" [class.active]="activeTab === 'Phụ xe'" (click)="setTab('Phụ xe')">Phụ xe ({{getAssistantCount()}})</button>
      <button type="button" [class.active]="activeTab === 'Đã khóa'" (click)="setTab('Đã khóa')">Đã khóa ({{getLockedCount()}})</button>
    </nav>
    <div class="search-filters-row">
      <input type="search" [(ngModel)]="searchQuery" (input)="filterPersonnel()" placeholder="Tìm theo tên hoặc số điện thoại">
      <select [(ngModel)]="roleFilter" (change)="filterPersonnel()"><option *ngFor="let item of roleOptions" [value]="item">{{item}}</option></select>
      <select [(ngModel)]="licenseFilter" (change)="filterPersonnel()"><option *ngFor="let item of licenseOptions" [value]="item">{{item}}</option></select>
      <select [(ngModel)]="statusFilter" (change)="filterPersonnel()"><option *ngFor="let item of statusOptions" [value]="item">{{item}}</option></select>
      <button type="button" (click)="clearFilters()">Xóa lọc</button>
    </div>
    <table><thead><tr><th>Họ tên</th><th>Vai trò</th><th>Điện thoại</th><th>Bằng lái</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody><tr *ngFor="let person of paginatedPersonnel">
        <td>{{person.name}}</td><td>{{person.role}}</td><td>{{person.phone}}</td><td>{{person.licenseClass}}</td><td>{{getDisplayStatus(person)}}</td>
        <td><button type="button" (click)="openEditModal(person)">Sửa</button><button type="button" (click)="toggleLock(person)">Khóa/Mở</button></td>
      </tr></tbody>
    </table>
    <p *ngIf="!paginatedPersonnel.length">Không có nhân sự phù hợp.</p>
    <div class="pagination"><button type="button" *ngFor="let page of getPaginationItems()" (click)="setPage(page)">{{page}}</button></div>
  </div>
</section>
<div class="modal-backdrop" *ngIf="isModalOpen">
  <form class="modal" (ngSubmit)="savePersonnel()">
    <h2>{{isEditMode ? 'Sửa nhân sự' : 'Thêm nhân sự'}}</h2>
    <input name="name" [(ngModel)]="currentPersonnel.name" placeholder="Họ tên">
    <input name="dob" type="date" [(ngModel)]="currentPersonnel.dob">
    <input name="phone" [(ngModel)]="currentPersonnel.phone" (input)="onPhoneInput()" placeholder="Số điện thoại">
    <input name="identityNumber" [(ngModel)]="currentPersonnel.identityNumber" placeholder="CCCD">
    <select name="role" [(ngModel)]="currentPersonnel.role"><option>Tài xế</option><option>Phụ xe</option></select>
    <input name="licenseClass" [(ngModel)]="currentPersonnel.licenseClass" placeholder="Hạng bằng">
    <input name="licenseExpiry" type="date" [(ngModel)]="currentPersonnel.licenseExpiry">
    <button type="submit" [disabled]="isSaving">Lưu</button><button type="button" (click)="closeModal()">Hủy</button>
  </form>
</div>
<div class="toast-container"><div *ngFor="let toast of toasts">{{toast.message}}</div></div>
