<div class="viago-customer-layout">
  
  <!-- Customer Navbar -->
  <app-customer-navbar
    class="viago-customer-navbar-wrapper"
    (openAuthModal)="onAuthModalOpen()"
  ></app-customer-navbar>

  <!-- Main Content Route -->
  <main class="viago-customer-main">
    <router-outlet></router-outlet>
  </main>

  <!-- Customer Footer -->
  <app-customer-footer class="viago-customer-footer-wrapper"></app-customer-footer>

  <!-- Fixed Overlays -->
  <app-chatbot></app-chatbot>
  @if (authModal.isOpen()) {
    <app-auth-modal (close)="authModal.close()"></app-auth-modal>
  }

  <!-- Toast thông báo (hành động phụ, góc trên bên phải) -->
  <div class="viago-customer-toasts" aria-live="polite">
    @for (toast of toastService.toasts$ | async; track toast.id) {
      <app-toast [variant]="toast.type" [message]="toast.message" (closed)="toastService.dismissToast(toast.id)"></app-toast>
    }
  </div>

</div>
