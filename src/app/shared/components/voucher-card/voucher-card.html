<div 
  class="voucher-card-container"
  [class.is-clickable]="context === 'checkout' && !effectiveDisabled"
  [class.is-disabled]="effectiveDisabled"
  [class.is-selected]="isSelected && !effectiveDisabled"
  [class.is-default]="!effectiveDisabled && !isSelected"
  (click)="handleCardClick($event)"
>
  <!-- Ticket Tear-Off Circle Cutouts -->
  <div class="notch notch-top"></div>
  <div class="notch notch-bottom"></div>

  <!-- Left Section (Voucher Details) -->
  <div class="voucher-details">
    <div>
      <!-- Voucher Title -->
      <div 
        class="voucher-title"
        [class.disabled-text]="effectiveDisabled"
      >
        {{ voucher?.title || 'Mã giảm giá' }}
      </div>

      <!-- Voucher Description -->
      <div class="voucher-desc">
        {{ voucher?.description }}
      </div>
    </div>

    <!-- Expiry & Count -->
    <div class="voucher-expiry-group">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="expiry-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
      </svg>
      <span>HSD: {{ voucher?.expiryDate }}</span>
      <span *ngIf="voucher?.count" class="count-badge">
        x{{ voucher.count }}
      </span>
    </div>
  </div>

  <!-- Right Section (Code Badge & Action Button / Selector) -->
  <div class="voucher-action-section">
    <!-- Voucher Code Badge -->
    <span 
      class="code-badge"
      [class.disabled-badge]="effectiveDisabled"
    >
      {{ voucher?.code }}
    </span>

    <!-- Checkout Context: Radio Selector -->
    <ng-container *ngIf="context === 'checkout'">
      <div class="radio-wrapper">
        <div 
          class="radio-circle"
          [class.disabled-radio]="effectiveDisabled"
          [class.selected-radio]="isSelected && !effectiveDisabled"
        >
          <div *ngIf="isSelected && !effectiveDisabled" class="radio-dot"></div>
        </div>
      </div>
    </ng-container>

    <!-- Non-Checkout Context: Action Button -->
    <ng-container *ngIf="context !== 'checkout'">
      <button 
        [disabled]="effectiveDisabled || (effectiveClaimed && context === 'home')"
        (click)="handleActionClick($event)"
        class="btn-voucher-action"
        [class.disabled-action]="effectiveDisabled || (effectiveClaimed && context === 'home')"
      >
        {{ computedActionText }}
      </button>
    </ng-container>
  </div>
</div>
