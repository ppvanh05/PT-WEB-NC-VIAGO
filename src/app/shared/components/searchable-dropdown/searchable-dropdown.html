<div class="searchable-dropdown-container relative w-full" [class.is-disabled]="disabled">
  <!-- Label with optional icon -->
  <div *ngIf="label" class="flex items-center gap-2 mb-1.5">
    <img *ngIf="iconPath" [src]="iconPath" class="w-4 h-4 object-contain" alt="input icon" />
    <label [for]="id" class="text-[13px] font-semibold text-[var(--color-text-body,#334155)] uppercase tracking-wider">
      {{ label }}
    </label>
  </div>

  <!-- Input Wrapper -->
  <div class="relative flex items-center">
    <!-- Main Input Box -->
    <input
      #inputEl
      [id]="id"
      type="text"
      [(ngModel)]="searchText"
      [disabled]="disabled"
      (focus)="onFocus()"
      (input)="onInput()"
      (keydown)="onKeyDown($event)"
      [placeholder]="placeholder"
      class="dropdown-input w-full bg-[var(--color-surface,#ffffff)] border border-[var(--color-border,#e2e8f0)] text-[var(--color-text-primary,#0f172a)] placeholder-[var(--color-text-secondary,#64748b)] font-medium text-sm py-2.5 pl-3.5 pr-10 rounded-[var(--radius-md,8px)] outline-none transition-all duration-200 shadow-sm focus:border-[var(--color-primary-600,#00236f)] focus:ring-2 focus:ring-[rgba(0,35,111,0.12)] disabled:bg-[var(--color-surface-muted,#f1f5f9)] disabled:text-[var(--color-text-disabled,#94a3b8)] disabled:border-[var(--color-border,#e2e8f0)] disabled:cursor-not-allowed"
      [class.pr-16]="searchText && !disabled"
    />

    <!-- Clear (X) Button -->
    <button
      *ngIf="searchText && !disabled"
      type="button"
      (click)="clearValue($event)"
      tabindex="-1"
      class="absolute right-8 top-1/2 -translate-y-1/2 text-[var(--color-text-secondary,#64748b)] hover:text-[var(--color-text-primary,#0f172a)] focus:outline-none transition-colors duration-150 p-1 rounded-full hover:bg-[var(--color-surface-muted,#f1f5f9)] flex items-center justify-center"
      title="Xóa lựa chọn"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-4 h-4 text-slate-400 hover:text-slate-600"
      >
        <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm-1.72 6.97a.75.75 0 1 0-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06L12 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L13.06 12l1.72-1.72a.75.75 0 1 0-1.06-1.06L12 10.94l-1.72-1.72Z" clip-rule="evenodd" />
      </svg>
    </button>

    <!-- Dropdown Arrow Icon -->
    <button
      type="button"
      [disabled]="disabled"
      (click)="toggleDropdown($event)"
      tabindex="-1"
      class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[var(--color-text-secondary,#64748b)] hover:text-[var(--color-text-primary,#0f172a)] focus:outline-none transition-transform duration-200 p-1 disabled:opacity-50 disabled:cursor-not-allowed"
      [class.rotate-180]="isOpen"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.5"
        stroke="currentColor"
        class="w-4 h-4"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
      </svg>
    </button>
  </div>

  <!-- Dropdown Menu Panel -->
  <div
    *ngIf="isOpen && !disabled"
    class="dropdown-menu absolute z-[var(--z-dropdown,1000)] left-0 right-0 mt-1 bg-[var(--color-surface,#ffffff)] border border-[var(--color-border,#e2e8f0)] rounded-[var(--radius-md,8px)] shadow-[var(--shadow-md,0_4px_12px_rgba(15,23,42,0.08))] max-h-60 overflow-y-auto py-1 transition-all duration-200"
  >
    <!-- List Items -->
    <ul *ngIf="filteredItems.length > 0; else noResults" class="divide-y divide-slate-50">
      <li
        *ngFor="let item of filteredItems"
        (mousedown)="selectItem(item)"
        class="dropdown-item px-4 py-2.5 hover:bg-[var(--color-neutral-50,#f8fafc)] text-[var(--color-text-body,#334155)] font-medium text-sm cursor-pointer transition-colors duration-150 flex items-center justify-between"
        [class.bg-[var(--color-primary-50,#eef2ff)]]="getItemValue(item) === value"
        [class.text-[var(--color-primary-600,#00236f)]]="getItemValue(item) === value"
        [class.font-semibold]="getItemValue(item) === value"
      >
        <span>{{ getItemLabel(item) }}</span>
        <!-- Checkmark icon if selected -->
        <svg
          *ngIf="getItemValue(item) === value"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="currentColor"
          class="w-4 h-4 text-[var(--color-primary-600,#00236f)] shrink-0"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
      </li>
    </ul>

    <!-- No Results Found State -->
    <ng-template #noResults>
      <div class="no-results-state px-4 py-4 text-[var(--color-text-secondary,#64748b)] text-sm text-center italic flex flex-col items-center justify-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-slate-300">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
        <span>{{ emptyText }}</span>
      </div>
    </ng-template>
  </div>
</div>
