<div class="searchable-dropdown-container" [class.is-disabled]="disabled">
  <!-- Label with optional icon -->
  <div *ngIf="label" class="dropdown-label-group">
    <img *ngIf="iconPath" [src]="iconPath" class="label-icon" alt="input icon" />
    <label [for]="id" class="dropdown-label">
      {{ label }}
    </label>
  </div>

  <!-- Input Wrapper -->
  <div class="dropdown-input-wrapper">
    <!-- Main Input Box -->
    <input
      #inputEl
      [id]="id"
      type="text"
      [(ngModel)]="searchText"
      [disabled]="disabled"
      (focus)="onFocus()"
      (input)="onInput()"
      (keydown)="onKeyDown($event)"
      [placeholder]="placeholder"
      class="dropdown-input"
      [class.has-clear]="searchText && !disabled"
    />

    <!-- Clear (X) Button -->
    <button
      *ngIf="searchText && !disabled"
      type="button"
      (click)="clearValue($event)"
      tabindex="-1"
      class="clear-btn"
      title="Xóa lựa chọn"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="clear-icon"
      >
        <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm-1.72 6.97a.75.75 0 1 0-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06L12 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L13.06 12l1.72-1.72a.75.75 0 1 0-1.06-1.06L12 10.94l-1.72-1.72Z" clip-rule="evenodd" />
      </svg>
    </button>

    <!-- Dropdown Arrow Icon -->
    <button
      type="button"
      [disabled]="disabled"
      (click)="toggleDropdown($event)"
      tabindex="-1"
      class="arrow-btn"
      [class.rotated]="isOpen"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.5"
        stroke="currentColor"
        class="arrow-svg"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
      </svg>
    </button>
  </div>

  <!-- Dropdown Menu Panel -->
  <div
    *ngIf="isOpen && !disabled"
    class="dropdown-menu"
  >
    <!-- List Items -->
    <ul *ngIf="filteredItems.length > 0; else noResults" class="dropdown-list">
      <li
        *ngFor="let item of filteredItems"
        (mousedown)="selectItem(item)"
        class="dropdown-item"
        [class.selected]="getItemValue(item) === value"
      >
        <span>{{ getItemLabel(item) }}</span>
        <!-- Checkmark icon if selected -->
        <svg
          *ngIf="getItemValue(item) === value"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="currentColor"
          class="check-icon"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
      </li>
    </ul>

    <!-- No Results Found State -->
    <ng-template #noResults>
      <div class="no-results-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="no-results-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
        <span>{{ emptyText }}</span>
      </div>
    </ng-template>
  </div>
</div>
