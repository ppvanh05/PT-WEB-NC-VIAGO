<ul class="password-checklist" aria-live="polite">
  @for (rule of rules; track rule.key; let i = $index) {
    <li
      class="password-checklist__item"
      [class.password-checklist__item--passed]="passed(i)"
      [class.password-checklist__item--failed]="highlightFailed && !passed(i)"
    >
      <span class="password-checklist__mark" aria-hidden="true">{{ passed(i) ? '✓' : '○' }}</span>
      <span>{{ rule.label }}</span>
    </li>
  }
</ul>
