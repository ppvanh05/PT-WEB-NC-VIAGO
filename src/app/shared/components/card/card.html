<div [ngClass]="cardClasses" (click)="onCardClick($event)" [attr.tabindex]="isInteractive && !disabled ? 0 : null"
  [attr.role]="isInteractive ? 'button' : null" [attr.aria-disabled]="disabled ? true : null">

  <!-- BACKGROUND IMAGE (FOR BOOKING OVERLAY) -->
  <div class="viago-card__bg-image" *ngIf="type === 'booking' && bookingOverlay && image" [style.backgroundImage]="'url(' + image + ')'">
    <div class="viago-card__bg-overlay"></div>
  </div>

  <!-- TOP IMAGE -->
  <div class="viago-card__image-top" *ngIf="(type === 'info' || type === 'booking') && image && !bookingOverlay">
    <img [src]="image" [alt]="title || ''">
  </div>

  <!-- TYPE: INFO -->
  <ng-container *ngIf="type === 'info'">
    <div class="viago-card__content viago-card__info-content" [ngClass]="{'viago-card__info--center': infoAlign === 'center', 'viago-card__info--has-image': !!image}">
      <div class="viago-card__info-icon" *ngIf="icon">
        <i [class]="icon"></i>
      </div>
      <div class="viago-card__info-text">
        <div class="viago-card__info-title" *ngIf="title">{{ title }}</div>
        <div class="viago-card__info-detail" *ngIf="infoDetail">{{ infoDetail }}</div>
        <div class="viago-card__info-desc" *ngIf="description">{{ description }}</div>
        <div class="viago-card__info-sub" *ngIf="infoSubDetail">{{ infoSubDetail }}</div>
      </div>
    </div>
  </ng-container>

  <!-- TYPE: BOOKING -->
  <ng-container *ngIf="type === 'booking'">
    <div class="viago-card__content viago-card__booking-content">
      <div class="viago-card__booking-badge" *ngIf="bookingBadge">
        {{ bookingBadge }}
      </div>
      
      <div class="viago-card__booking-title" *ngIf="title">{{ title }}</div>
      
      <div class="viago-card__booking-tags" *ngIf="bookingTags && bookingTags.length > 0">
        <span class="viago-card__booking-tag" *ngFor="let tag of bookingTags">{{ tag }}</span>
      </div>

      <div class="viago-card__booking-meta" *ngIf="bookingDistance || bookingDuration">
        <div class="viago-card__meta-item" *ngIf="bookingDistance">
          <i class="bi bi-geo-alt"></i> {{ bookingDistance }}
        </div>
        <div class="viago-card__meta-item" *ngIf="bookingDuration">
          <i class="bi bi-clock"></i> {{ bookingDuration }}
        </div>
      </div>

      <div class="viago-card__booking-footer">
        <div class="viago-card__booking-price-section">
          <div class="viago-card__price-label" *ngIf="bookingPriceLabel">{{ bookingPriceLabel }}</div>
          <div class="viago-card__price-value" *ngIf="bookingPrice">{{ bookingPrice }}</div>
        </div>
        <button class="viago-card__booking-btn" (click)="onActionClick($event)">{{ bookingButtonText }}</button>
      </div>
    </div>
  </ng-container>

  <!-- TYPE: STAT -->
  <ng-container *ngIf="type === 'stat'">
    <div class="viago-card__content viago-card__stat-container">
      <div class="viago-card__stat-top">
        <div class="viago-card__stat-meta">
          <span class="viago-card__stat-title" *ngIf="title">{{ title }}</span>
          <ng-content select="[card-title]"></ng-content>
        </div>
        <div class="viago-card__stat-icon-wrapper" [ngClass]="'viago-card__stat-icon--' + iconVariant" *ngIf="icon">
          <i [class]="icon"></i>
        </div>
      </div>
      <div class="viago-card__stat-body">
        <div class="viago-card__stat-value" *ngIf="value !== undefined && value !== null">{{ value }}</div>
      </div>
      <div class="viago-card__stat-footer" *ngIf="trend || trendLabel || description">
        <div class="viago-card__stat-trend" [ngClass]="'viago-card__stat-trend--' + computedTrendDirection" *ngIf="trend">
          <i [class]="computedTrendDirection === 'up' ? 'bi bi-arrow-up-short' : computedTrendDirection === 'down' ? 'bi bi-arrow-down-short' : 'bi bi-dash-short'"></i>
          <span>{{ trend }}</span>
        </div>
        <span class="viago-card__stat-trend-label" *ngIf="trendLabel">{{ trendLabel }}</span>
        <p class="viago-card__stat-desc" *ngIf="description">{{ description }}</p>
      </div>
    </div>
  </ng-container>


  <!-- TYPE: DEFAULT -->
  <ng-container *ngIf="type === 'default'">
    <div class="viago-card__header">
      <ng-content select="[card-header]"></ng-content>
    </div>
    <div class="viago-card__content">
      <ng-content></ng-content>
    </div>
    <div class="viago-card__footer">
      <ng-content select="[card-footer]"></ng-content>
    </div>
  </ng-container>
</div>
