<div 
  [class]="'voucher-card-container relative flex border rounded-[var(--radius-lg,12px)] overflow-hidden transition-all duration-200 min-h-[110px] w-full ' +
    (context === 'checkout' && !effectiveDisabled ? 'cursor-pointer hover:shadow-md ' : '') +
    (effectiveDisabled ? 'is-disabled border-[var(--color-border,#e2e8f0)] bg-[var(--color-surface-muted,#f1f5f9)] opacity-70 grayscale-[25%] ' : 
      (isSelected ? 'is-selected border-[var(--color-accent-600,#ff6a00)] bg-[var(--color-accent-50,#fff3eb)] shadow-sm ring-1 ring-[var(--color-accent-600,#ff6a00)] ' : 
        'is-default border-orange-200/80 bg-[#FFF9F5] hover:border-orange-300 shadow-sm'))"
  (click)="handleCardClick($event)"
>
  <!-- Ticket Tear-Off Circle Cutouts -->
  <div class="notch notch-top absolute right-[35%] -top-2.5 w-4.5 h-4.5 bg-white rounded-full border-b border-[var(--color-border,#e2e8f0)] z-10"></div>
  <div class="notch notch-bottom absolute right-[35%] -bottom-2.5 w-4.5 h-4.5 bg-white rounded-full border-t border-[var(--color-border,#e2e8f0)] z-10"></div>

  <!-- Left Section (Voucher Details) -->
  <div class="w-[65%] p-3.5 flex flex-col justify-between pr-5 border-r border-dashed border-orange-200/70">
    <div>
      <!-- Voucher Title -->
      <div 
        [class]="'text-base font-extrabold flex items-center gap-1.5 leading-tight ' + 
          (effectiveDisabled ? 'text-[var(--color-text-secondary,#64748b)]' : 'text-[var(--color-accent-600,#ff6a00)]')"
      >
        {{ voucher?.title || 'Mã giảm giá' }}
      </div>

      <!-- Voucher Description -->
      <div class="text-[11px] text-[var(--color-text-secondary,#64748b)] font-medium mt-1.5 leading-relaxed line-clamp-2">
        {{ voucher?.description }}
      </div>
    </div>

    <!-- Expiry & Count -->
    <div class="text-[10px] text-[var(--color-text-disabled,#94a3b8)] font-semibold mt-2 flex items-center gap-1 flex-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5 shrink-0 opacity-75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
      </svg>
      <span>HSD: {{ voucher?.expiryDate }}</span>
      <span *ngIf="voucher?.count" class="text-slate-500 font-bold text-[10px] ml-1 bg-orange-100/60 px-1.5 py-0.2 rounded">
        x{{ voucher.count }}
      </span>
    </div>
  </div>

  <!-- Right Section (Code Badge & Action Button / Selector) -->
  <div class="w-[35%] p-3 flex flex-col items-center justify-center bg-[#FFFDFB] relative shrink-0 gap-2">
    <!-- Voucher Code Badge -->
    <span 
      [class]="'text-[10px] font-bold px-2 py-0.5 rounded border border-dashed tracking-wider uppercase select-none text-center ' +
        (effectiveDisabled ? 'bg-slate-100 border-slate-300 text-slate-400' : 'bg-orange-100/80 border-orange-300 text-[var(--color-accent-600,#ff6a00)]')"
    >
      {{ voucher?.code }}
    </span>

    <!-- Checkout Context: Radio Selector -->
    <ng-container *ngIf="context === 'checkout'">
      <div class="flex items-center justify-center mt-1">
        <div 
          [class]="'w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all ' + 
            (effectiveDisabled ? 'border-slate-300 bg-slate-100' : 
              (isSelected ? 'border-[var(--color-accent-600,#ff6a00)] bg-[var(--color-accent-600,#ff6a00)]' : 'border-slate-300 bg-white'))"
        >
          <div *ngIf="isSelected && !effectiveDisabled" class="w-1.5 h-1.5 rounded-full bg-white"></div>
        </div>
      </div>
    </ng-container>

    <!-- Non-Checkout Context: Action Button -->
    <ng-container *ngIf="context !== 'checkout'">
      <button 
        [disabled]="effectiveDisabled || (effectiveClaimed && context === 'home')"
        (click)="handleActionClick($event)"
        [class]="'w-full py-1.5 rounded-[var(--radius-md,8px)] text-[10px] font-extrabold shadow-xs transition-all border-0 text-center uppercase tracking-wider cursor-pointer ' +
          (effectiveDisabled || (effectiveClaimed && context === 'home') ? 
            'bg-slate-200 text-slate-400 cursor-not-allowed select-none shadow-none' : 
            'bg-[var(--color-accent-600,#ff6a00)] hover:bg-[var(--color-accent-700,#d95800)] active:scale-[0.98] text-white')"
      >
        {{ computedActionText }}
      </button>
    </ng-container>
  </div>
</div>
