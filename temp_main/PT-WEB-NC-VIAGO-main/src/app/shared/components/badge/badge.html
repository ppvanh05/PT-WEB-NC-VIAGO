<span [ngClass]="badgeClasses">
  <span *ngIf="dot" class="viago-badge__dot"></span>
  <i *ngIf="icon" [class]="icon" class="viago-badge__icon"></i>
  <ng-content select="[badge-icon]"></ng-content>

  <span class="viago-badge__content">
    <ng-container *ngIf="label">{{ label }}</ng-container>
    <ng-content></ng-content>
  </span>

  <button *ngIf="removable" type="button" class="viago-badge__remove-btn" (click)="onRemoveClick($event)"
    aria-label="Remove badge">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 3L3 9M3 3L9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </button>
</span>
