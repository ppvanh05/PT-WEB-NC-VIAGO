<div class="viago-field">
  @if (label()) {
    <label
      class="viago-field__label"
      [attr.for]="id() || null"
    >
      {{ label() }}

      @if (required()) {
        <span class="viago-field__required">*</span>
      }
    </label>
  }

  <select
    class="viago-select"
    [class.viago-select--error]="error()"
    [class.viago-select--placeholder]="!value()"
    [id]="id()"
    [name]="name()"
    [value]="value()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-invalid]="error() ? 'true' : null"
    (change)="onChange($event)"
  >
    <option value="" disabled>
      {{ placeholder() }}
    </option>

    @for (option of options(); track option.value) {
      <option [value]="option.value">
        {{ option.label }}
      </option>
    }
  </select>

  @if (error()) {
    <span class="viago-field__error">
      {{ error() }}
    </span>
  } @else if (helperText()) {
    <span class="viago-field__helper">
      {{ helperText() }}
    </span>
  }
</div>
