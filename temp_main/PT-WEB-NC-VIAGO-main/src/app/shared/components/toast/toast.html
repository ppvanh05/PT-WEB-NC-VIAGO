@if (visible) {
  <div
    class="toast"
    [class]="'toast toast--' + variant"
    [attr.role]="variant === 'error' || variant === 'warning' ? 'alert' : 'status'"
    [attr.aria-live]="variant === 'error' || variant === 'warning' ? 'assertive' : 'polite'"
  >
    <span class="toast__icon" aria-hidden="true">
      @switch (variant) {
        @case ('success') {
          <svg viewBox="0 0 24 24"><path d="m7 12 3 3 7-7" /></svg>
        }
        @case ('error') {
          <svg viewBox="0 0 24 24"><path d="m8 8 8 8M16 8l-8 8" /></svg>
        }
        @case ('warning') {
          <svg viewBox="0 0 24 24"><path d="M12 7v6m0 4h.01" /></svg>
        }
        @default {
          <svg viewBox="0 0 24 24"><path d="M12 11v6m0-10h.01" /></svg>
        }
      }
    </span>

    <div class="toast__content">
      <strong class="toast__title">{{ title || defaultTitles[variant] }}</strong>
      @if (message) {
        <p class="toast__message">{{ message }}</p>
      }
    </div>

    @if (dismissible) {
      <button class="toast__close" type="button" aria-label="Đóng thông báo" (click)="close()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
      </button>
    }
  </div>
}
