<div class="admin-layout" [class.sidebar-collapsed]="isCollapsed()">
  <app-admin-sidebar></app-admin-sidebar>
  <main class="admin-content">
    <app-admin-topbar [user]="{ name: session.account()?.name || '', role: roleLabel(session.account()?.roleName || '') || 'Nhân viên', avatarUrl: session.account()?.avatar || '' }" (userAction)="$event === 'profile' ? openProfile() : $event === 'logout' ? logout() : null"></app-admin-topbar>
    @if (profileSaved) { <p class="profile-feedback" role="status">Đã lưu thông tin cá nhân.</p> }
    <router-outlet></router-outlet>
  </main>
</div>
<app-admin-profile (saved)="saveProfile($event)"></app-admin-profile>
