@if (visible) {
  <div
    class="toast"
    [class]="'toast toast--' + variant"
    [attr.role]="variant === 'error' || variant === 'warning' ? 'alert' : 'status'"
    [attr.aria-live]="variant === 'error' || variant === 'warning' ? 'assertive' : 'polite'"
  >
    <span class="toast__icon" aria-hidden="true">
      @switch (variant) {
        @case ('success') {
          <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        }
        @case ('error') {
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        }
        @case ('warning') {
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        }
        @default {
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        }
      }
    </span>

    <div class="toast__content">
      @if (title) {
        <strong class="toast__title">{{ title }}</strong>
      }
      @if (message) {
        <p class="toast__message">{{ message }}</p>
      }
    </div>

    @if (dismissible) {
      <button class="toast__close" type="button" aria-label="Đóng thông báo" (click)="close()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
      </button>
    }
  </div>
}
