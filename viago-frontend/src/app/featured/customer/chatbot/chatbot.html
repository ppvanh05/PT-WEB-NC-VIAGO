<!-- Floating Chatbot Toggle Button -->
<button
  type="button"
  class="viago-chatbot-btn"
  [attr.aria-label]="isOpen ? 'Đóng Chatbot' : 'Mở Chatbot'"
  [attr.aria-expanded]="isOpen"
  aria-controls="viago-chatbot-window"
  (click)="toggleChat()"
>
  <svg
    *ngIf="!isOpen"
    aria-hidden="true"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path
      d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"
    />
    <path d="M8 10h8M8 14h5" />
  </svg>
  <svg
    *ngIf="isOpen"
    aria-hidden="true"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  >
    <path d="m6 6 12 12M6 18 18 6" />
  </svg>

  <span class="viago-chatbot-dot" *ngIf="!isOpen">
    <span class="viago-chatbot-ping"></span>
    <span class="viago-chatbot-badge"></span>
  </span>
</button>

<!-- Chat Window -->
<div
  id="viago-chatbot-window"
  class="cb-window"
  [class.open]="isOpen"
  [inert]="!isOpen"
  [attr.aria-hidden]="!isOpen"
  role="region"
  aria-label="Hỗ trợ VIAGO"
>
  <!-- Header -->
  <div class="cb-header">
    <div class="cb-header-info">
      <div class="cb-avatar">
        <ng-container [ngTemplateOutlet]="botIcon"></ng-container>
      </div>
      <div>
        <h3 class="cb-title">VIAGO Assistant</h3>
        <span class="cb-status"
          ><span class="cb-dot" *ngIf="connected"></span> {{ statusLabel }}</span
        >
      </div>
    </div>
    <button type="button" class="cb-close-btn" aria-label="Thu nhỏ Chatbot" (click)="toggleChat()">
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M5 12h14" />
      </svg>
    </button>
  </div>

  <!-- Chat Area -->
  <div class="cb-body" #chatScroll>
    <div class="cb-messages">
      <p *ngIf="!messages.length">Xin chào! VIAGO có thể hỗ trợ gì cho chuyến đi của bạn?</p>
      <div
        *ngFor="let msg of messages"
        class="cb-message-group"
        [ngClass]="msg.role !== 'CUSTOMER' ? 'msg-bot' : 'msg-user'"
      >
        <div class="cb-avatar-sm" *ngIf="msg.role !== 'CUSTOMER'">
          <ng-container *ngIf="msg.role !== 'AGENT'" [ngTemplateOutlet]="botIcon"></ng-container>
          <svg
            *ngIf="msg.role === 'AGENT'"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
          </svg>
        </div>
        <div class="cb-message-content">
          <div class="cb-bubble" style="white-space: pre-wrap">{{ msg.text }}</div>
          <div class="cb-sources" *ngIf="msg.sources?.length">
            <span>Nguồn tham khảo:</span>
            <a
              *ngFor="let source of msg.sources"
              [href]="source.url"
              target="_blank"
              rel="noopener"
              >{{ source.title }}</a
            >
          </div>
          <span class="cb-time"
            >{{ msg.role === 'AGENT' ? 'CSKH · ' : '' }}{{ time(msg.createdAt) }}</span
          >
        </div>
      </div>

      <!-- Typing Indicator -->
      <div class="cb-message-group msg-bot" *ngIf="isTyping">
        <div class="cb-avatar-sm">
          <ng-container [ngTemplateOutlet]="botIcon"></ng-container>
        </div>
        <div class="cb-message-content">
          <div class="cb-bubble typing">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Suggestions & Input Area -->
  <div class="cb-footer">
    <div
      class="cb-handoff-actions"
      *ngIf="status === 'AWAITING_CONFIRMATION'"
      role="group"
      aria-label="Chọn cách hỗ trợ"
    >
      <button
        type="button"
        class="cb-sug-btn"
        (click)="confirmHandoff()"
        [disabled]="sending || isTyping"
      >
        Kết nối với nhân viên
      </button>
      <button
        type="button"
        class="cb-sug-btn"
        (click)="resumeChat()"
        [disabled]="sending || isTyping"
      >
        Tiếp tục với trợ lý
      </button>
    </div>
    <button
      *ngIf="status === 'QUEUED'"
      type="button"
      class="cb-sug-btn"
      (click)="resumeChat()"
      [disabled]="sending || isTyping"
    >
      Tiếp tục với trợ lý
    </button>
    <div *ngIf="error" role="alert">
      {{ error }} <button type="button" (click)="connect()">Kết nối lại</button>
    </div>
    <button
      *ngIf="status === 'CLOSED' || error"
      type="button"
      (click)="newConversation()"
      [disabled]="sending"
    >
      Mở hội thoại mới
    </button>
    <div class="cb-suggestions">
      <button
        *ngFor="let sug of suggestions"
        class="cb-sug-btn"
        [disabled]="sending || isTyping || status === 'CLOSED'"
        (click)="sendSuggestion(sug)"
      >
        {{ sug }}
      </button>
    </div>
    <div class="cb-input-wrap">
      <input
        type="text"
        class="cb-input"
        placeholder="Nhập câu hỏi của bạn..."
        [(ngModel)]="userInput"
        maxlength="4000"
        [disabled]="sending || status === 'CLOSED'"
        (keyup.enter)="sendMessage()"
      />
      <button
        type="button"
        class="cb-send-btn"
        aria-label="Gửi tin nhắn"
        [disabled]="!userInput.trim() || sending || isTyping || status === 'CLOSED'"
        (click)="sendMessage()"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13" />
        </svg>
      </button>
    </div>
  </div>
</div>

<ng-template #botIcon>
  <svg
    aria-hidden="true"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="3" y="7" width="18" height="14" rx="4" />
    <path d="M12 3v4M8 12v2M16 12v2M9 17h6" />
  </svg>
</ng-template>
